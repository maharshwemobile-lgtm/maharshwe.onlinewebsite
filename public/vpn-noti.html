<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaharShwe VPN Notification Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+Myanmar:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, 'Noto Sans Myanmar', sans-serif; }
    .field { width:100%; border-radius:18px; border:1px solid #dbe3ef; background:#f8fafc; padding:13px 14px; font-weight:800; outline:none; }
    .field:focus { border-color:#0f766e; box-shadow:0 0 0 4px rgba(15,118,110,.12); background:#fff; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-950">
  <main class="mx-auto max-w-2xl px-4 py-6">
    <section class="rounded-[30px] bg-slate-950 p-6 text-white shadow-xl">
      <p class="text-xs font-black uppercase tracking-widest text-emerald-300">MaharShwe Admin</p>
      <h1 class="mt-3 text-3xl font-black">VPN / Video Downloader Noti ပို့ရန်</h1>
      <p class="mt-3 text-sm font-bold leading-7 text-slate-300">VPN users, Video Downloader users, နှစ်ခုလုံးကို FCM topic ဖြင့် notification ပို့နိုင်ပါတယ်။</p>
    </section>

    <section class="mt-4 rounded-[28px] bg-white p-5 shadow-sm ring-1 ring-slate-200">
      <label class="text-sm font-black text-slate-700">Admin API Key</label>
      <div class="mt-2 grid gap-2 sm:grid-cols-[1fr_auto]">
        <input id="apiKey" class="field" type="password" placeholder="TELEGRAM_API_KEY / Admin API Key ထည့်ပါ" />
        <button id="saveKeyBtn" class="rounded-2xl bg-teal-700 px-5 py-3 text-sm font-black text-white">Save</button>
      </div>
      <p class="mt-2 text-xs font-bold text-slate-500">Key ကို browser localStorage ထဲမှာပဲ သိမ်းပါတယ်။</p>
    </section>

    <section class="mt-4 rounded-[28px] bg-white p-5 shadow-sm ring-1 ring-slate-200">
      <form id="notiForm" class="grid gap-4">
        <div>
          <label class="text-sm font-black text-slate-700">Target</label>
          <select id="target" class="field mt-2">
            <option value="vpn">VPN Users — maharshwe-vpn</option>
            <option value="video">Video Downloader Users — mahar-video-downloader</option>
            <option value="both">Both — VPN + Video Downloader</option>
          </select>
        </div>

        <div>
          <label class="text-sm font-black text-slate-700">Title</label>
          <input id="title" class="field mt-2" value="Mahar Video Downloader" required />
        </div>

        <div>
          <label class="text-sm font-black text-slate-700">Message</label>
          <textarea id="body" class="field mt-2 min-h-32" required>Facebook / TikTok / YouTube link ကို Share လုပ်ပြီး MaharShwe VPN ထဲက Video Downloader Plugin ဖြင့် ဖွင့်နိုင်ပါပြီ။</textarea>
        </div>

        <div>
          <label class="text-sm font-black text-slate-700">Open URL</label>
          <input id="url" class="field mt-2" value="https://maharshwe.online/vpn/video-downloader.html" />
        </div>

        <div class="grid gap-2 sm:grid-cols-3">
          <button type="button" id="presetVpnBtn" class="rounded-2xl bg-slate-900 px-4 py-3 text-sm font-black text-white">VPN Preset</button>
          <button type="button" id="presetVideoBtn" class="rounded-2xl bg-orange-500 px-4 py-3 text-sm font-black text-white">Video Preset</button>
          <button type="submit" class="rounded-2xl bg-emerald-700 px-4 py-3 text-sm font-black text-white">Send Noti</button>
        </div>
      </form>
    </section>

    <section class="mt-4 rounded-[24px] bg-white p-4 shadow-sm ring-1 ring-slate-200">
      <h2 class="text-sm font-black text-slate-800">Result</h2>
      <pre id="result" class="mt-3 max-h-80 overflow-auto whitespace-pre-wrap rounded-2xl bg-slate-950 p-4 text-xs font-bold text-emerald-200">Ready</pre>
    </section>
  </main>

  <script>
    const TOPICS = {
      vpn: 'maharshwe-vpn',
      video: 'mahar-video-downloader'
    };

    const apiKeyInput = document.getElementById('apiKey');
    const resultBox = document.getElementById('result');
    apiKeyInput.value = localStorage.getItem('maharshwe_admin_api_key') || '';

    function setResult(data) {
      resultBox.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    function getTopics(target) {
      if (target === 'both') return [TOPICS.vpn, TOPICS.video];
      if (target === 'video') return [TOPICS.video];
      return [TOPICS.vpn];
    }

    async function sendToTopic(topic) {
      const key = apiKeyInput.value.trim();
      if (!key) throw new Error('Admin API Key လိုအပ်ပါတယ်။');
      const payload = {
        title: document.getElementById('title').value.trim(),
        body: document.getElementById('body').value.trim(),
        url: document.getElementById('url').value.trim(),
        topic
      };
      if (!payload.title || !payload.body) throw new Error('Title / Message လိုအပ်ပါတယ်။');

      const res = await fetch('/api/notifications/send', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.error) throw new Error(data.message || data.error || 'Notification failed');
      return { topic, response: data };
    }

    document.getElementById('saveKeyBtn').addEventListener('click', () => {
      localStorage.setItem('maharshwe_admin_api_key', apiKeyInput.value.trim());
      setResult('API Key သိမ်းပြီးပါပြီ။');
    });

    document.getElementById('presetVpnBtn').addEventListener('click', () => {
      document.getElementById('target').value = 'vpn';
      document.getElementById('title').value = 'MaharShwe VPN Update';
      document.getElementById('body').value = 'MaharShwe VPN update အသစ်ရပါပြီ။ Download page မှာ update လုပ်နိုင်ပါတယ်။';
      document.getElementById('url').value = 'https://maharshwe.online/download/?auto=1';
      setResult('VPN preset ready.');
    });

    document.getElementById('presetVideoBtn').addEventListener('click', () => {
      document.getElementById('target').value = 'video';
      document.getElementById('title').value = 'Mahar Video Downloader';
      document.getElementById('body').value = 'Facebook / TikTok / YouTube link ကို Share လုပ်ပြီး MaharShwe VPN ထဲက Video Downloader Plugin ဖြင့် ဖွင့်နိုင်ပါပြီ။';
      document.getElementById('url').value = 'https://maharshwe.online/vpn/video-downloader.html';
      setResult('Video Downloader preset ready.');
    });

    document.getElementById('notiForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const topics = getTopics(document.getElementById('target').value);
      setResult('Sending to: ' + topics.join(', '));
      try {
        const results = [];
        for (const topic of topics) {
          results.push(await sendToTopic(topic));
        }
        setResult({ ok: true, sent: results.length, results });
      } catch (error) {
        setResult({ ok: false, error: error.message });
      }
    });
  </script>
</body>
</html>
